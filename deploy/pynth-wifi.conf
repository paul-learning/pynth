# /etc/default/pynth-wifi  (wird von install-wifi.sh einmal angelegt, danach bleibt deine Version)
# Nach Aenderungen: sudo systemctl restart pynth-wifi

# Name und Passwort des Pynth-Hotspots (Passwort mind. 8 Zeichen)
HOTSPOT_SSID=pynth
HOTSPOT_PSK=pynthpynth

# Sekunden ohne WLAN, bis der Hotspot startet
GRACE=60
# Im Hotspot ohne verbundene Geraete: alle so viele Sekunden nach bekannten WLANs suchen
RETRY=300

IFACE=wlan0
